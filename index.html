<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1030" />
    <!-- Chemins RELATIFS : le manifeste est servi sous la base Vite (`/mochi/`),
         et ses propres `start_url`/`icons` se résolvent par rapport à lui. Rien à
         retoucher si le sous-dossier de déploiement change. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <title>Mochi</title>
  </head>
  <body>
    <canvas id="face"></canvas>
    <canvas id="fx" aria-hidden="true"></canvas>
    <!-- Invite affichée UNIQUEMENT quand le navigateur refuse de démarrer la voix
         sans geste (cf. « Démarrage automatique » dans main.ts). Elle ne capte
         aucun clic : c'est le premier contact avec l'écran, où qu'il soit, qui
         réveille Mochi — le doigt n'a pas à viser. -->
    <p id="wake" hidden>Touche l’écran pour réveiller Mochi</p>
    <aside id="dev-panel" aria-label="Panneau debug"></aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
