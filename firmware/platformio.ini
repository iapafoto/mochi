; Firmware Mochi — ESP32-WROOM-32 (38 broches).
; Robot équilibriste 2 roues : cœur 1 = boucle d'équilibre temps réel,
; cœur 0 = BLE (commandes app) + HC-SR04. Voir firmware/README.md.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Dépendances verrouillées (reproductible). Mettre à jour en connaissance de cause.
lib_deps =
    gin66/FastAccelStepper @ ^0.30.13   ; steppers non bloquants (timing matériel)
    rfetick/MPU6050_light @ ^1.1.0       ; angle fusionné (filtre complémentaire) léger
    h2zero/NimBLE-Arduino @ ^1.4.2       ; pile BLE compacte (RAM/flash réduits)

build_flags =
    -D CORE_DEBUG_LEVEL=2
; Tuning : console série intégrée (moniteur 115200, taper `?`) — cf. README §tuning.

; Test autonome du MPU6050 (câblage seul, sans le firmware complet) :
;   pio run -e mputest -t upload && pio device monitor
[env:mputest]
extends = env:esp32dev
build_src_filter = -<*> +<../test_standalone/mpu_test.cpp>

; Test autonome des steppers via CNC Shield (câblage seul, sans le firmware complet) :
;   pio run -e steppertest -t upload && pio device monitor
[env:steppertest]
extends = env:esp32dev
build_src_filter = -<*> +<../test_standalone/stepper_test.cpp>

; Scanner de câblage : pulse chaque GPIO tour à tour pour identifier où
; chaque fil arrive réellement (diagnostic de branchement).
;   pio run -e pinscan -t upload && pio device monitor
[env:pinscan]
extends = env:esp32dev
build_src_filter = -<*> +<../test_standalone/pin_scan.cpp>

; Test « tout pareil » : mêmes STEP sur 25+26, même DIR sur 27+33 → tout
; moteur branché tourne, quel que soit le croisement des fils X/Y.
;   pio run -e allpins -t upload
[env:allpins]
extends = env:esp32dev
build_src_filter = -<*> +<../test_standalone/allpins_test.cpp>
